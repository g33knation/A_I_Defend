services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scans:/scans
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d defense" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./scanners:/app/scanners
      # - /var/run/docker.sock:/var/run/docker.sock # REMOVED: Insecure
    ports:
      - "8000:8000"
    working_dir: /app

  frontend:
    build: ./frontend-react
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8002:80"

  # Network Monitor Agent (Active Scanning)
  network-monitor:
    build: ./scanners
    container_name: network-monitor
    hostname: network-monitor
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=network
    command: [ "python", "-u", "/app/specialized_agent.py", "network" ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Network Intelligence Agent (Passive + Active Scanning)
  # No credentials needed - uses network protocols only
  network-intel:
    build: ./scanners
    container_name: network-intel
    hostname: network-intel
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=network_intel
    command: [ "python", "-u", "/app/specialized_agent.py", "network_intel" ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Malware Scanner Agent
  malware-scanner:
    build: ./scanners
    container_name: malware-scanner
    hostname: malware-scanner
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=malware
    command: [ "python", "-u", "/app/specialized_agent.py", "malware" ]
    volumes:
      # - /:/host_wsl:ro            # REMOVED: Too broad
      # - C:/:/host_windows:ro      # REMOVED: Too broad
      - ./scans:/host_wsl:ro # Restricted to scans directory for now
      - /var/run/docker.sock:/var/run/docker.sock # Kept for malware scanner but flagged
    restart: unless-stopped

  # Security Audit Scanner Agent
  security-scanner:
    build: ./scanners
    container_name: security-scanner
    hostname: security-scanner
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=security_audit
    command: [ "python", "-u", "/app/specialized_agent.py", "security_audit" ]
    volumes:
      - /etc:/etc:ro
      - /var/log:/var/log:ro
      - /:/host_wsl:ro # Mount WSL root to /host_wsl
      - C:/:/host_windows:ro # Mount Windows C drive to /host_windows
    restart: unless-stopped

  # Defense Agent (Autonomous Defense Actions)
  defense-agent:
    build: ./scanners
    container_name: defense-agent
    hostname: defense-agent
    depends_on:
      - backend
    environment:
      - API_URL=http://localhost:8000
      - QUARANTINE_PATH=/quarantine
    command: [ "python", "-u", "/app/defense_agent.py" ]
    cap_add:
      - NET_ADMIN # For iptables firewall management
      - SYS_PTRACE # For process management
    network_mode: "host" # Required for firewall rules to affect host
    volumes:
      - quarantine_data:/quarantine
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true # Required for iptables
    restart: unless-stopped

  # Legacy all-in-one scanner (optional, can be removed)
  scanner:
    build: ./scanners
    container_name: scanner
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/events
      - SCAN_MODE=network
    volumes:
      - /etc:/etc:ro
      - /var/log:/var/log:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    profiles:
      - legacy # Only start with --profile legacy

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    command: tail -f /dev/null # idle, waits for manual trigger
    volumes:
      - ./scans:/scans
    depends_on:
      - backend

  tshark:
    image: ubuntu:22.04
    container_name: tshark
    network_mode: "host" # so it can sniff real traffic
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - /bin/bash
      - -c
      - |
        apt-get update && \
        apt-get install -y tshark && \
        tshark --version && \
        tail -f /dev/null
    depends_on:
      - backend

  nmap:
    image: docker.io/instrumentisto/nmap:latest
    container_name: nmap
    command: tail -f /dev/null # idle
    depends_on:
      - backend

  model-server:
    build: ./model-server
    container_name: model-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      - backend

volumes:
  db_data:
  ollama_data:
  quarantine_data:


