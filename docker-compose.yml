services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scans:/scans
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d defense" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:changeit@db:5432/defense}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672//}
      BRAIN_API_KEY: ${BRAIN_API_KEY:-octopus-nervous-system-secret}
    volumes:
      - ./scanners:/app/scanners
      # - /var/run/docker.sock:/var/run/docker.sock # REMOVED: Insecure
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    working_dir: /app

  frontend:
    build: ./frontend-react
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8002:80"

  # Network Leg (Active Scanning)
  net-leg:
    build: ./scanners
    container_name: net-leg
    hostname: net-leg
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=network
      - BRAIN_API_KEY=${BRAIN_API_KEY:-octopus-nervous-system-secret}
    command: [ "python", "-u", "/app/specialized_agent.py", "network" ]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Intelligence Leg (Passive + Active Scanning)
  # No credentials needed - uses network protocols only
  intel-leg:
    build: ./scanners
    container_name: intel-leg
    hostname: intel-leg
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=network_intel
      - BRAIN_API_KEY=${BRAIN_API_KEY:-octopus-nervous-system-secret}
    command: [ "python", "-u", "/app/specialized_agent.py", "network_intel" ]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  # Malware Leg
  malware-leg:
    build: ./scanners
    container_name: malware-leg
    hostname: malware-leg
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=malware
      - BRAIN_API_KEY=${BRAIN_API_KEY:-octopus-nervous-system-secret}
    command: [ "python", "-u", "/app/specialized_agent.py", "malware" ]
    volumes:
      - ./scans:/host_scans:ro # Restricted to scans directory
      - /var/run/docker.sock:/var/run/docker.sock # Kept for malware scanner but flagged
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped

  # Audit Leg
  audit-leg:
    build: ./scanners
    container_name: audit-leg
    hostname: audit-leg
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - AGENT_TYPE=security_audit
      - BRAIN_API_KEY=${BRAIN_API_KEY:-octopus-nervous-system-secret}
    command: [ "python", "-u", "/app/specialized_agent.py", "security_audit" ]
    volumes:
      - /etc:/etc:ro
      - /var/log:/var/log:ro
      - ./scanners:/host_audit:ro # Restricted isolation
      - C:/:/host_windows:ro # Mount Windows C drive to /host_windows
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped

  # Defense Leg (Autonomous Defense Actions)
  defense-leg:
    build: ./scanners
    container_name: defense-leg
    hostname: defense-leg
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
      - QUARANTINE_PATH=/quarantine
      - BRAIN_API_KEY=${BRAIN_API_KEY:-octopus-nervous-system-secret}
    command: [ "python", "-u", "/app/defense_agent.py" ]
    cap_add:
      - NET_ADMIN # For iptables (container-only on Windows)
      - SYS_PTRACE
    # network_mode: "host" - Removed for Windows compatibility
    volumes:
      - quarantine_data:/quarantine
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Legacy all-in-one scanner (optional, can be removed)
  scanner:
    build: ./scanners
    container_name: scanner
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/events
      - SCAN_MODE=network
    volumes:
      - /etc:/etc:ro
      - /var/log:/var/log:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    profiles:
      - legacy # Only start with --profile legacy

  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    command: tail -f /dev/null # idle, waits for manual trigger
    volumes:
      - ./scans:/scans
    depends_on:
      - backend

  tshark:
    image: ubuntu:22.04
    container_name: tshark
    network_mode: "host" # so it can sniff real traffic
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command:
      - /bin/bash
      - -c
      - |
        apt-get update && \
        apt-get install -y tshark && \
        tshark --version && \
        tail -f /dev/null
    depends_on:
      - backend

  nmap:
    image: docker.io/instrumentisto/nmap:latest
    container_name: nmap
    command: tail -f /dev/null # idle
    depends_on:
      - backend

  model-server:
    build: ./model-server
    container_name: model-server
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 8G # Large memory for AI models
    volumes:
      - ollama_data:/root/.ollama
    depends_on:
      - backend

volumes:
  db_data:
  ollama_data:
  quarantine_data:


